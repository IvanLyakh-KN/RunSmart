<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.min.css">
    <link rel="stylesheet" href="sass/modern-normalize.min.css">
    <link rel="stylesheet" href="css/font.css">
    <title>Document</title>
</head>

<body>
    <div class="promo">
        <div class="container">
            <header class="header">
                <div class="header__logo">
                    <a href="#"><img src="icons/running-man-2-64.png" alt="logo-run-smart"></a>
                </div>
                <div class="header__representative">
                    <p>Официальный представитель</p>
                    <h2>Garmin, Polar, Suunto</h2>
                </div>
                <div class="header__contacts">
                    <a href="tel:+74999228974" class="header__phone">+7 (499) 922-89-74</a>
                    <div class="btn btn_header">
                        <a href="#">заказать звонок</a>
                    </div>
                </div>
            </header>
            <div class="promo__wrapper">
                <div class="promo__text-container">
                    <h1 class="promo__header">Подбор пульсометра</h1>
                    <h2 class="promo__subheader">с учётом Вашего уровня подготовки</h2>
                </div>
                <div class="promo__items-container">
                    <div class="promo__item">
                        <img src="icons/timer.svg" alt="timer">
                        <p>Время подбора:</br>
                            10 минут</p>
                    </div>
                    <div class="promo__item">
                        <img src="icons/hand-cart.svg" alt="hand-cart">
                        <p>Бесплатная</br>
                            доставка</p>
                    </div>
                    <div class="promo__item">
                        <img src="icons/messages.svg" alt="messages">
                        <p>Ответим</br>
                            на все вопросы</p>
                    </div>
                </div>
                <div class="btn btn_promo">
                    <a href="#">заказать консультацию</a>
                </div>
                <div class="promo__order-katalog">
                    или
                    <a href="#">Перейти в каталог</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
